<!-- Cart Page -->
<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
        <meta name="description" content="Cart of the cat store"/>
        <title>Meowstore</title>
        <link rel="stylesheet" href="css/navigationStyle.css"/>
        <link rel="stylesheet" href="css/orderform.css"/>
    </head>
    <body>
        <header>
            <h1 style="text-align: center;">Cart</h1>
            <nav>
                <ul>
                    <li><a href="home.html">Home</a></li>
                    <li><a href="catalogue.html">Catalogue</a></li>
                    <li><a href="about.html">About</a></li>
                    <li><a href="cart.html">Cart</a></li>
                </ul>
            </nav>
        </header>
        <main>
            <!--List of Items in Cart-->
            <ul id="cartItems" style="text-align: center;">
                <!--Cart items will be dynamically inserted here-->
            </ul>

            <!--Total Price-->
            <p style="text-align: center;"><span id="totalPrice">0.00</span></p>

            <form id="orderForm">                
                <!--Name-->
                <label id="nameInput"for="name"><input type="text" id="name" name="name" required placeholder="Name"></label>

                <!--Email Address-->
                <label id="emailInput" for="email"><input type="text" id="email" name="email" required placeholder="Email"></label>

                <!--Address-->
                <label id="addressInput" for="address"><input type="text" id="address" name="address" required placeholder="Address"></label>

                <!--Terms and Conditions-->
                <label for="terms">
                    <input type="checkbox" id="terms" name="terms" required>
                    I agree to the terms and conditions
                </label>

                <!--Confirm Purchase Button-->
                <button type="submit">Confirm Purchase</button>
            </form>
        </main>
        <footer>
            <p><a href="privacy.html">Privacy Policy</a></p>
            <p><a href="contact.html">Contact Us</a></p>
            <p>Copyright © 2024 Meowstore AB. All rights reserved.</p>
        </footer>
        <script type="module" src="script/cart.js"></script>
    </body>
</html>
